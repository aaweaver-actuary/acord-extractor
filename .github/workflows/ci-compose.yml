name: CI (Docker Compose)

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install backend dependencies
        run: uv sync --all-extras --dev

      - name: Install frontend dependencies
        working-directory: accord-extractor-ui
        run: npm ci

      - name: Install Playwright browser
        working-directory: accord-extractor-ui
        run: npx playwright install --with-deps chromium

      - name: Ensure writable local virtualenv cache path
        run: |
          rm -rf .venv

      - name: Run backend and frontend checks
        run: make check

      - name: Docker Buildx setup
        uses: docker/setup-buildx-action@v3

      - name: Build services
        run: docker compose build --pull

      - name: Start backend/frontend services
        run: docker compose up -d backend frontend

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed health check"
          docker compose logs backend
          exit 1

      - name: Wait for frontend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              echo "Frontend is reachable"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed readiness check"
          docker compose logs frontend
          exit 1

      - name: Run Playwright E2E
        run: |
          cd accord-extractor-ui
          PW_BACKEND_HOST=127.0.0.1 \
          PW_BACKEND_PORT=8000 \
          PW_API_BASE_URL=http://127.0.0.1:8000 \
          PW_FRONTEND_HOST=127.0.0.1 \
          PW_FRONTEND_PORT=3000 \
          npm run test:e2e -- --workers=1 --retries=1

      - name: Capture compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Shutdown stack
        if: always()
        run: docker compose down -v --remove-orphans
