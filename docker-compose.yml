services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./workspace:/workspace
    environment:
      WORKSPACE_ROOT: /workspace
      PYTHONUNBUFFERED: "1"
    command: ["uv", "run", "acord-extractor", "serve-api", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: ./accord-extractor-ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./accord-extractor-ui:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
